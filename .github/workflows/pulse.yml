name: pulse
on:
  schedule:
    - cron: "0,30 * * * *"   # staggered starts; new run replaces the old -> no gaps
  workflow_dispatch: {}
concurrency:
  group: pulse
  cancel-in-progress: true
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Scan every 60s
        run: |
          end=$((SECONDS+3300))
          while [ $SECONDS -lt $end ]; do
            curl -sf --max-time 100 "https://thelab.opentab.digital/api/flow" -o /dev/null || true
            curl -sf --max-time 60  "https://thelab.opentab.digital/api/mlb"  -o /dev/null || true
            sleep 60
          done
