name: pulse
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pulse
  cancel-in-progress: true
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Scan every 60s; commit state every 10th pass
        run: |
          mkdir -p state
          i=0
          end=$((SECONDS+20400))
          while [ $SECONDS -lt $end ]; do
            curl -sf --max-time 100 "https://thelab.opentab.digital/api/flow" -o /dev/null || true
            curl -sf --max-time 100 "https://thelab.opentab.digital/api/pmflow" -o /dev/null || true
            i=$((i+1))
            if [ $((i % 5)) -eq 0 ]; then
              curl -sf --max-time 120 "https://thelab.opentab.digital/api/mlb" -o /dev/null || true
            fi
            if [ $((i % 5)) -eq 0 ]; then
              # freshness-guarded commits: NEVER overwrite good state with a cold instance's
              # older dump — this exact clobber erased ledger history twice (blob suspended)
              ok=0
              for f in dump:flow pmdump:pmflow; do
                name="${f%%:*}"; api="${f##*:}"
                curl -sf --max-time 60 "https://thelab.opentab.digital/api/$api?dump=1" -o /tmp/$name.json || continue
                [ -s /tmp/$name.json ] || continue
                grep -q '"st":null' /tmp/$name.json && continue
                newat=$(jq -r '.at // 0' /tmp/$name.json 2>/dev/null || echo 0)
                oldat=$(jq -r '.at // 0' state/$name.json 2>/dev/null || echo 0)
                if [ "${newat%.*}" -gt "${oldat%.*}" ] 2>/dev/null; then
                  cp /tmp/$name.json state/$name.json; ok=1
                fi
              done
              if [ $ok -eq 1 ]; then
                git config user.email "pulse@thelab"; git config user.name "pulse"
                git add state/ || true
                git commit -q -m "state snapshot" || true
                git pull -q --rebase || true
                git push -q || true
              fi
            fi
            sleep 60
          done
